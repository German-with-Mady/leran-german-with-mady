<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers Page 2</title>
     <link rel="stylesheet" href="style.css">
</head>
    <body class="numbers2-bg">
    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img"> 
             <span class="logo-text">Learn Deutsch With Mady</span>

        </div>
    </nav>

    <h1 style="padding: 50px; text-align: center;" class="numbers2-h1">Click for every Number to listen it.</h1> 
     <div class="numbers1-container">
    <button class="N20-btn" onclick="let s=new SpeechSynthesisUtterance('20'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Zwanzig 20</button><br>
    <button class="N30-btn" onclick="let s=new SpeechSynthesisUtterance('30'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Dreißig 30</button><br>
    <button class="N40-btn" onclick="let s=new SpeechSynthesisUtterance('40'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Vierzig 40</button><br>
    <button class="N50-btn" onclick="let s=new SpeechSynthesisUtterance('50'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Fünfzig 50</button><br>
    <button class="N60-btn" onclick="let s=new SpeechSynthesisUtterance('60'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Sechzig 60</button><br>
    <button class="N70-btn" onclick="let s=new SpeechSynthesisUtterance('70'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Siebzig 70</button><br>
    <button class="N80-btn" onclick="let s=new SpeechSynthesisUtterance('80'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Achtzig 80</button><br>
    <button class="N90-btn" onclick="let s=new SpeechSynthesisUtterance('90'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Neunzig 90</button><br>
    <button class="N100-btn" onclick="let s=new SpeechSynthesisUtterance('100'); s.lang='de-DE'; s.rate=0.7; speechSynthesis.speak(s)">Hundert 100</button><br>
</div>

<p>Notes:
    21 is called einundzwanzig
    31 is called einunddreissig
    41 ...
    ...
    and any number such as 2,5,8 we can replace it by 1 and called sieb...
    acht...
    sech...
    ... 
</p><br><br><br><br><br><br><br><br><br><br><br><br>
